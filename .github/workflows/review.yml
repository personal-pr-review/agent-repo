name: Centralized PR Review

on:
  workflow_call:
    inputs:
      repository:
        description: owner/repo for the target repository
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      base_branch:
        description: PR base branch
        required: true
        type: string
      head_branch:
        description: PR head branch
        required: true
        type: string
      commit_sha:
        description: PR head commit SHA
        required: true
        type: string
    secrets:
      repo_token:
        description: GitHub token for API access
        required: true
      LLM_API_KEY:
        description: API key for PwC OpenAI-compatible endpoint
        required: true

env:
  LLM_API_URL: ${{ vars.LLM_API_URL || 'https://genai-sharedservice-americas.pwc.com' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'azure.gpt-4o-mini' }}

jobs:
  run-pr-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout centralized agent repo
        uses: actions/checkout@v6
        with:
          repository: personal-pr-review/agent-repo
          ref: main
          path: agent-repo

      - name: Show agent repo revision
        working-directory: agent-repo
        run: |
          git rev-parse HEAD
          grep -n "GraphQL PR review" src/pr_review/comment_poster.py || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent-repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PR review pipeline
        working-directory: agent-repo
        env:
          GITHUB_TOKEN: ${{ secrets.repo_token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ env.LLM_API_URL }}
          LLM_MODEL: ${{ env.LLM_MODEL }}
        run: |
          python main.py \
            --repository "${{ inputs.repository }}" \
            --pr-number "${{ inputs.pr_number }}" \
            --base-branch "${{ inputs.base_branch }}" \
            --head-branch "${{ inputs.head_branch }}" \
            --commit-sha "${{ inputs.commit_sha }}"

      - name: Upload PR review document
        uses: actions/upload-artifact@v6
        with:
          name: pr-review-docx-pr${{ inputs.pr_number }}-run${{ github.run_id }}
          path: agent-repo/artifacts/pr_review_report.docx

      - name: Post PR review comments
        working-directory: agent-repo
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.repo_token }}
        run: |
          python post_comments.py \
            --repository "${{ inputs.repository }}" \
            --pr-number "${{ inputs.pr_number }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --review-output "artifacts/review_output.json"
